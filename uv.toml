# uv 配置文件 - 国内镜像源设置
# 这个文件会被 uv 自动读取，优先级高于 pyproject.toml

[index]
# 主要镜像源 - 清华大学镜像 (推荐)
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"

# 备用镜像源
[[index.extra]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"

[[index.extra]]
name = "douban"
url = "https://pypi.douban.com/simple/"

[[index.extra]]
name = "ustc"
url = "https://pypi.mirrors.ustc.edu.cn/simple/"

[[index.extra]]
name = "tencent"
url = "https://mirrors.cloud.tencent.com/pypi/simple/"

# 网络配置
[network]
# 增加超时时间以适应网络环境
timeout = 60
# 重试次数
retries = 3

# 缓存配置
[cache]
# 启用缓存以提高后续安装速度
enabled = true
# 缓存目录 (可选，uv 会自动选择合适的位置)
# dir = "~/.cache/uv"

# 全局设置
[global]
# 信任所有镜像源的 SSL 证书
trusted-hosts = [
    "pypi.tuna.tsinghua.edu.cn",
    "mirrors.aliyun.com",
    "pypi.douban.com",
    "pypi.mirrors.ustc.edu.cn",
    "mirrors.cloud.tencent.com"
]
