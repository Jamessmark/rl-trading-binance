[project]
name = "rl-trading-binance"
version = "0.1.0"
description = "A high-performance, research-grade reinforcement learning system for intraday trading on Binance Futures"
authors = [
    {name = "Yuriy Kolesnikov", email = "yuriy@example.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["reinforcement-learning", "trading", "binance", "deep-learning", "finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    # Core ML
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    # Environment
    "gymnasium==0.29.1",
    "numpy>=1.24",
    "pandas>=2.0",
    # Logging and visualization
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "termcolor>=2.3",
    "seaborn>=0.12.2",
    # Data and preprocessing
    "scikit-learn>=1.2",
    # For npz data I/O
    "joblib>=1.3",
    # Compatibility
    "python-dateutil>=2.8",
    "datasets>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.12",
    "flake8>=6.0",
    "mypy>=1.0",
]

optuna = [
    "optuna>=3.0",
    "plotly>=5.0",  # For Optuna visualization
]

jupyter = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "notebook>=6.0",
]

all = [
    "rl-trading-binance[dev,optuna,jupyter]"
]

[project.urls]
Homepage = "https://github.com/YuriyKolesnikov/rl-trading-binance"
Repository = "https://github.com/YuriyKolesnikov/rl-trading-binance"
Documentation = "https://github.com/YuriyKolesnikov/rl-trading-binance#readme"
"Bug Tracker" = "https://github.com/YuriyKolesnikov/rl-trading-binance/issues"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
# 国内镜像源配置 (提高下载速度)
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
extra-index-url = [
    "https://mirrors.aliyun.com/pypi/simple/",
    "https://pypi.douban.com/simple/",
    "https://pypi.mirrors.ustc.edu.cn/simple/",
]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["rl_trading_binance"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=rl_trading_binance",
    "--cov-report=html",
    "--cov-report=term-missing",
]
